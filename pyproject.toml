[project]
name = "tpu-megakernel"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "jax[tpu]==0.11.1",
    "huggingface-hub>=0.34",
    "numpy>=2",
    "safetensors>=0.6",
    "tiktoken>=0.14.0",
    "tokenizers>=0.21",
]

[project.optional-dependencies]
eval = [
    "lm-eval[api]>=0.4.9,<0.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "cpu32: requires 32 virtual CPU devices",
]

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "pytest>=9",
]
